<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- En DESARROLLO la CSP llega como cabecera HTTP desde el proceso main (ver
         src/main/index.ts), porque hay que relajarla (script-src 'unsafe-inline')

         (inlineCsp en electron.vite.config.ts). No la escribas a mano aquí. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  </head>
